:root{--purple:#7C3AED}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;color:#111;background:#fff;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
.wrap{max-width:1060px;margin:0 auto;padding:0 24px}
nav{display:flex;align-items:center;justify-content:space-between;padding:20px 0}
.logo{display:inline-flex;align-items:center;gap:9px;font-weight:800;font-size:19px}
.nav-links{display:flex;gap:22px;align-items:center;font-size:15px}
.nav-links a{color:#555} .nav-links a:hover{color:#111}
.btn{display:inline-flex;align-items:center;background:var(--purple);color:#fff !important;border-radius:10px;padding:10px 20px;font-size:15px;font-weight:600;white-space:nowrap}
.hero{text-align:center;padding:64px 0 0}
.hero h1{font-size:clamp(44px,7vw,76px);line-height:1.14;margin:26px 0 18px;letter-spacing:-1px;font-weight:800}
.hero h1 .accent{color:var(--purple)}
.sub{color:#666;font-size:19px;margin:0 auto;max-width:520px;line-height:1.6}
.cta{margin-top:34px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.cta .btn{padding:14px 32px;font-size:17px;border-radius:12px}
.cta .ghost{background:#fff;color:#111 !important;border:1.5px solid #111;font-weight:600}
.demo{max-width:780px;margin:64px auto 0;border:1.5px solid #111;border-radius:16px;overflow:hidden;background:#fff;box-shadow:8px 10px 0 var(--purple);text-align:left}
.demo-top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #eee}
.demo-badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#444;margin-left:auto}
.demo-dot{width:8px;height:8px;border-radius:50%}
.demo-foot{padding:10px 14px;border-top:1px solid #eee;font-size:14px;color:#555}
.demo-draw{stroke-dasharray:100;stroke-dashoffset:100;animation:demoDraw .85s ease forwards}
.demo-fade{opacity:0;animation:demoFade .45s ease forwards}
@keyframes demoDraw{to{stroke-dashoffset:0}}
@keyframes demoFade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.demo-cursor{animation:demoCursor 3.6s ease forwards;opacity:0}
@keyframes demoCursor{0%{transform:translate(62px,66px);opacity:1}28%{transform:translate(200px,142px);opacity:1}48%{transform:translate(322px,102px);opacity:1}72%{transform:translate(402px,80px);opacity:1}92%{transform:translate(330px,250px);opacity:1}100%{transform:translate(470px,225px);opacity:0}}
.points{text-align:center;color:#888;font-size:15px;margin:44px 0 0;letter-spacing:.5px}
.points b{color:#444;font-weight:600}
footer{text-align:center;color:#bbb;font-size:13px;padding:56px 0 30px}
footer a{color:#999} footer a:hover{color:var(--purple)}
@media (max-width:640px){.hero{padding-top:40px}.demo{margin-top:44px}.nav-links a:not(.btn){display:none}.points{font-size:13px;letter-spacing:0;line-height:2}}

<script>
(function(){
  var dot=document.getElementById('badgeDot'), txt=document.getElementById('badgeText'), cap=document.getElementById('caption'), holder=document.getElementById('canvasHolder');
  function phase(){
    dot.style.background='#f59e0b'; txt.textContent='未保存改动'; cap.textContent='随手画，想到哪画到哪';
    setTimeout(function(){ txt.textContent='正在保存…'; cap.textContent='停笔片刻，自动存到云端'; },3600);
    setTimeout(function(){ dot.style.background='#22c55e'; var d=new Date(); txt.textContent='已保存 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); cap.textContent='关掉页面，换台设备打开还在'; },4600);
  }
  function loop(){ phase(); setTimeout(function(){ var svg=holder.querySelector('svg'); if(svg){ svg.replaceWith(svg.cloneNode(true)); } loop(); },7600); }
  loop();
})();
</script>
